      <stop offset="40%" stop-color="#14161f" />
      <stop offset="85%" stop-color="#0a0b0e" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <radialGradient id="centerLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c563" />
      <stop offset="70%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#c4821a" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0c0d12"/>
  
  <!-- Outer Vinyl Edge -->
  <circle cx="256" cy="256" r="220" fill="url(#vinylShine)" stroke="#3a3f52" stroke-width="3" />
  
  <!-- Grooves -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#232734" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#282d3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1f2330" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#282d3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1f2330" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#282d3c" stroke-width="1.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1f2330" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#282d3c" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Center Label -->
  <circle cx="256" cy="256" r="75" fill="url(#centerLabel)" stroke="#452a05" stroke-width="2"/>
  
